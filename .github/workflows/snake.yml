name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0077B6&color_dots=#ebedf0,#CAF0F8,#90E0EF,#00B4D8,#0077B6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#48CAE4&color_dots=#161b22,#03045E,#0077B6,#00B4D8,#90E0EF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: snake
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
